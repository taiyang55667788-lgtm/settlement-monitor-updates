name: Build and publish Windows update

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  R2_PUBLIC_BASE_URL: https://pub-649c460a80df4ab1a6c668e4e67e2b6d.r2.dev

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Verify desktop report and agent-table flows
        run: pnpm test:desktop

      - name: Build Windows installer and portable app
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Point the update manifest to Cloudflare R2
        run: node scripts/prepare-update-manifest.js

      - name: Verify update manifest matches release files
        run: pnpm verify:update-artifacts

      - name: Keep verification build for inspection
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: settlement-monitor-windows-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      - name: Upload release files to Cloudflare R2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: settlement-monitor-updates
        run: node scripts/upload-release-to-r2.js

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
